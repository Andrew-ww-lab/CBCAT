plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.cbcatfix'
version = '1.0.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    mavenLocal()
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Create's Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "tterrag Maven"
        url = "https://maven.tterrag.com"
    }
}

dependencies {
    // Create Mod Dependency
    implementation name: "create-1.21.1-6.0.10"
    
    // Flywheel, Ponder, Registrate (Create dependencies)
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6")
    implementation("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")

    // CBC & Aeronautics Dependencies
    implementation name: "createbigcannons-5.11.7+mc.1.21.1"
    implementation name: "sable-neoforge-1.21.1-2.0.3"
    implementation name: "ritchiesprojectilelib-2.1.2+mc.1.21.1-neoforge"
    

    // Local Mods in libs/ folder
    implementation('maven.modrinth:create-radars:0.4.8-1.21.1')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

neoForge {
    version = '21.1.228'

    runs {
        client {
            client()
            systemProperty 'neoforge.logging.console.level', 'debug'
            systemProperty 'mixin.debug.verbose', 'true'
            systemProperty 'mixin.debug.export', 'true'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        cbcatfix {
            sourceSet sourceSets.main
        }
    }
}
