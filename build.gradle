plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.cbcatfix'
version = providers.gradleProperty('mod_version').get()

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Generate the open tube mesh from the SAME constants used for mounted slot transforms.
def launcherGeometrySource = file('src/main/java/com/cbcatfix/rocket/RocketMounts.java')
def launcherResources = layout.buildDirectory.dir('generated/launcherResources')
tasks.register('generateLauncherModel') {
    inputs.file(launcherGeometrySource)
    outputs.dir(launcherResources)
    doLast {
        def source = launcherGeometrySource.text
        def number = { name ->
            def match = source =~ /\b${name}\s*=\s*([\d.]+);/
            if (!match.find()) throw new GradleException("Missing launcher geometry constant ${name}")
            Double.parseDouble(match.group(1))
        }
        int columns = number('SMALL_COLUMNS'), rows = number('SMALL_ROWS')
        double pitchX = number('SMALL_COLUMN_PITCH_PX'), pitchZ = number('SMALL_ROW_PITCH_PX')
        double halfHole = number('SMALL_HOLE_WIDTH_PX') / 2
        def elements = []
        def wall = { x0, z0, x1, z1 ->
            elements.add([from: [x0, 0, z0], to: [x1, 16, z1],
                faces: ['north','south','east','west','up','down'].collectEntries {
                    [(it): [texture: '#0']]
                }])
        }
        // Only longitudinal walls; no face ever spans a tube aperture.
        double previous = 0
        for (int col = 0; col < columns; col++) {
            double center = 8 + (col - (columns - 1) * 0.5) * pitchX
            wall(previous, 1.5, center - halfHole, 14.5)
            previous = center + halfHole
        }
        wall(previous, 1.5, 16, 14.5)
        for (int col = 0; col < columns; col++) {
            double centerX = 8 + (col - (columns - 1) * 0.5) * pitchX
            previous = 1.5
            for (int row = 0; row < rows; row++) {
                double centerZ = 8 + (row - (rows - 1) * 0.5) * pitchZ
                wall(centerX - halfHole, previous, centerX + halfHole, centerZ - halfHole)
                previous = centerZ + halfHole
            }
            wall(centerX - halfHole, previous, centerX + halfHole, 14.5)
        }
        def model = [parent: 'minecraft:block/block', elements: elements,
            display: [gui: [rotation: [35,-135,0], scale: [0.625,0.625,0.625]]]]
        def output = launcherResources.get().file('assets/cbc_at/models/block/rocket_pod/rocket_pod.json').asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(model))
    }
}
sourceSets.main.resources.srcDir(launcherResources)
tasks.named('processResources') {
    dependsOn('generateLauncherModel')
    inputs.property('mod_version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.version)
    }
}

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Create's Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "tterrag Maven"
        url = "https://maven.tterrag.com"
    }
}

dependencies {
    // Create Mod Dependency
    implementation name: "create-1.21.1-6.0.10"
    
    // Flywheel, Ponder, Registrate (Create dependencies)
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6")
    implementation("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")

    // CBC & Aeronautics Dependencies
    implementation name: "createbigcannons-5.11.7+mc.1.21.1"
    implementation name: "cbc_at_Neoforge_1.21.1_0.1.4c"
    compileOnly name: "sable-neoforge-1.21.1-2.0.3"
    // Public pose/target API is embedded in Sable at runtime; expose it only for compilation.
    compileOnly files(zipTree('libs/sable-neoforge-1.21.1-2.0.3.jar').matching {
        include 'META-INF/jarjar/sable-companion-common-*.jar'
    })
    implementation name: "ritchiesprojectilelib-2.1.2+mc.1.21.1-neoforge"
    // Development-only targeting validation. This is not packaged and is not a required mod dependency.
    compileOnly("maven.modrinth:jade:15.10.6+neoforge")
    

    compileOnly('maven.modrinth:create-radars:0.4.8-1.21.1')
    // Explicit development integrations: never ingest old builds or arbitrary libs/*.jar.
    if (!project.hasProperty('minimalRuntime')) {
        runtimeOnly name: "sable-neoforge-1.21.1-2.0.3"
        runtimeOnly name: "create-aeronautics-bundled-1.21.1-1.3.0"
        runtimeOnly name: "jei-1.21.1-neoforge-19.27.0.340"
        runtimeOnly("maven.modrinth:jade:15.10.6+neoforge")
        runtimeOnly('maven.modrinth:create-radars:0.4.8-1.21.1')
    }
}

neoForge {
    version = '21.1.228'

    runs {
        client {
            client()
            if (project.hasProperty('runDirectory')) gameDirectory = file(project.property('runDirectory'))
            systemProperty 'neoforge.logging.console.level', 'debug'
            systemProperty 'mixin.debug.verbose', 'true'
            systemProperty 'mixin.debug.export', 'true'
            if (project.hasProperty('quickPlayWorld')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('quickPlayWorld').toString()
            }
        }
        server {
            server()
            if (project.hasProperty('runDirectory')) gameDirectory = file(project.property('runDirectory'))
            programArgument '--nogui'
        }
    }

    mods {
        cbcatfix {
            sourceSet sourceSets.main
        }
    }
}

// Opt-in integration tests run real transformed projectiles in an isolated game world.
if (project.hasProperty('rocketTests')) {
    sourceSets.main.java.srcDir('dev/rocket-tests/java')
    sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/rocketTests'))
    tasks.register('generateRocketTestStructure') {
        def output = layout.buildDirectory.file('generated/rocketTests/data/cbcatfix/structure/rocket_empty.nbt')
        outputs.file(output)
        doLast {
            def target = output.get().asFile
            target.parentFile.mkdirs()
            new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(target))).withCloseable { out ->
                out.writeByte(10); out.writeUTF('')
                out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
                out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
                [16, 8, 8].each { out.writeInt(it) }
                out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
                out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
                ['blocks', 'entities'].each { out.writeByte(9); out.writeUTF(it); out.writeByte(10); out.writeInt(0) }
                out.writeByte(0)
            }
        }
    }
    tasks.named('processResources') { dependsOn('generateRocketTestStructure') }
    neoForge.runs {
        rocketTests {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('rocket-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cbcatfix'
        }
    }
}

tasks.named('jar') {
    exclude('com/cbcatfix/rocket/tests/**', 'data/cbcatfix/structure/rocket_empty.nbt')
}
