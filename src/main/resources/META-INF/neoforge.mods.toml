modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Andrew-ww-lab/CBCAT/issues"

[[mods]]
    modId = "cbcatfix"
    version = "${mod_version}"
    displayName = "CBCAT Fix"
    description = '''
Rocket launcher progression, ammunition variants, loading assistance and compatibility
fixes for Create Big Cannons: Advanced Technologies on Minecraft 1.21.1 NeoForge.

Includes optional Sable, Radars, Jade and JEI integrations.
    '''
    logoFile = ""
    authors = "${mod_authors}"
    credits = ""

[[dependencies.cbcatfix]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.228,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1]"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "create"
    type = "required"
    versionRange = "[6.0.9,6.1.0)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "createbigcannons"
    type = "required"
    versionRange = "[5.11.7,6.0)"
    # Radars can load after CBC through CBC Neo Warfare; do not close that dependency cycle.
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "cbc_at"
    type = "required"
    versionRange = "[0.1.4,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "create_radar"
    type = "optional"
    versionRange = "[5.0-EA-3.1.0-1.21.1,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "sable"
    type = "optional"
    versionRange = "[2.0.3,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "jade"
    type = "optional"
    versionRange = "[15.10,)"
    ordering = "AFTER"
    side = "CLIENT"

[[mixins]]
    config = "cbcatfix.mixins.json"
