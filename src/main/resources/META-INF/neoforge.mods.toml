modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/cbcatfix/issues"

[[mods]]
    modId = "cbcatfix"
    version = "1.0.0"
    displayName = "CBCAT Fix"
    description = '''
Compatibility fix for Create Big Cannons: Advanced Technologies (cbc_at) on Minecraft 1.21.1 NeoForge.

Fixes crash: java.lang.NoSuchMethodError on ControlPitchContraption.onRecoil
when firing any cannon from the cbc_at mod.

Root cause: cbc_at was compiled against an older CBC API where onRecoil() had 2 parameters.
CBC 5.11.7 changed it to 3 parameters (added cannon position Vec3 for Sable integration).
This mod injects the missing bridge method via Mixin.
    '''
    logoFile = ""
    authors = "cbcatfix"
    credits = ""

[[dependencies.cbcatfix]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "createbigcannons"
    type = "required"
    versionRange = "[5.11.7,6.0)"
    ordering = "BEFORE"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "cbc_at"
    type = "required"
    versionRange = "[0.1.4,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "create_radar"
    type = "optional"
    versionRange = "[0.4.4,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "sable"
    type = "optional"
    versionRange = "[2.0.3,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.cbcatfix]]
    modId = "jade"
    type = "optional"
    versionRange = "[15.10,)"
    ordering = "AFTER"
    side = "CLIENT"

[[mixins]]
    config = "cbcatfix.mixins.json"
